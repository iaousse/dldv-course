<svg viewBox="0 0 560 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <text x="280" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">Boîte à moustaches — distribution des prix par quartier</text>

  <!-- axes -->
  <line x1="60" y1="320" x2="520" y2="320" stroke="#374151" stroke-width="2"/>
  <line x1="60" y1="320" x2="60" y2="40" stroke="#374151" stroke-width="2"/>
  <text x="24" y="180" text-anchor="middle" font-size="13" fill="#374151" transform="rotate(-90 24 180)">Prix (MAD, milliers)</text>

  <!-- Quartier A : min50 Q1 80 med100 Q3120 max150 outlier190 -->
  <g stroke="#0077BB" stroke-width="2">
    <line x1="150" y1="255" x2="150" y2="216" fill="none"/>
    <line x1="150" y1="125" x2="150" y2="164" fill="none"/>
    <line x1="125" y1="255" x2="175" y2="255"/>
    <line x1="125" y1="125" x2="175" y2="125"/>
    <rect x="110" y="164" width="80" height="52" fill="#0077BB" fill-opacity="0.25"/>
    <line x1="110" y1="190" x2="190" y2="190" stroke-width="2.5"/>
  </g>
  <circle cx="150" cy="73" r="4" fill="#0077BB"/>

  <!-- Quartier B : min70 Q1100 med130 Q3155 max180 -->
  <g stroke="#EE7733" stroke-width="2">
    <line x1="300" y1="229" x2="300" y2="190" fill="none"/>
    <line x1="300" y1="86"  x2="300" y2="118.5" fill="none"/>
    <line x1="275" y1="229" x2="325" y2="229"/>
    <line x1="275" y1="86"  x2="325" y2="86"/>
    <rect x="260" y="118.5" width="80" height="71.5" fill="#EE7733" fill-opacity="0.25"/>
    <line x1="260" y1="151" x2="340" y2="151" stroke-width="2.5"/>
  </g>

  <!-- Quartier C : min40 Q1 60 med75 Q3 95 max120 outlier10 -->
  <g stroke="#009988" stroke-width="2">
    <line x1="450" y1="268" x2="450" y2="242" fill="none"/>
    <line x1="450" y1="164" x2="450" y2="196.5" fill="none"/>
    <line x1="425" y1="268" x2="475" y2="268"/>
    <line x1="425" y1="164" x2="475" y2="164"/>
    <rect x="410" y="196.5" width="80" height="46" fill="#009988" fill-opacity="0.25"/>
    <line x1="410" y1="222.5" x2="490" y2="222.5" stroke-width="2.5"/>
  </g>
  <circle cx="450" cy="307" r="4" fill="#009988"/>

  <!-- category labels -->
  <g font-size="13" fill="#1f2937" text-anchor="middle">
    <text x="150" y="345">Quartier A</text>
    <text x="300" y="345">Quartier B</text>
    <text x="450" y="345">Quartier C</text>
  </g>
</svg>
