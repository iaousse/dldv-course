<svg viewBox="0 0 560 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <text x="280" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">Courbe — évolution mensuelle du chiffre d'affaires</text>

  <!-- axes -->
  <line x1="60" y1="320" x2="520" y2="320" stroke="#374151" stroke-width="2"/>
  <line x1="60" y1="320" x2="60" y2="40" stroke="#374151" stroke-width="2"/>
  <text x="290" y="358" text-anchor="middle" font-size="13" fill="#374151">Mois</text>
  <text x="24" y="180" text-anchor="middle" font-size="13" fill="#374151" transform="rotate(-90 24 180)">Chiffre d'affaires (k MAD)</text>

  <!-- line -->
  <polyline
    points="70,175.6 109.1,161.1 148.2,153.9 187.3,132.2 226.4,117.8 265.5,103.3 304.5,110.6 343.6,175.6 382.7,125.0 421.8,103.3 460.9,81.7 500,60.0"
    fill="none" stroke="#0077BB" stroke-width="2.5"/>

  <!-- markers -->
  <g fill="#0077BB">
    <circle cx="70"    cy="175.6" r="4"/>
    <circle cx="109.1" cy="161.1" r="4"/>
    <circle cx="148.2" cy="153.9" r="4"/>
    <circle cx="187.3" cy="132.2" r="4"/>
    <circle cx="226.4" cy="117.8" r="4"/>
    <circle cx="265.5" cy="103.3" r="4"/>
    <circle cx="304.5" cy="110.6" r="4"/>
    <circle cx="343.6" cy="175.6" r="4" fill="#CC3311"/>
    <circle cx="382.7" cy="125.0" r="4"/>
    <circle cx="421.8" cy="103.3" r="4"/>
    <circle cx="460.9" cy="81.7"  r="4"/>
    <circle cx="500"   cy="60.0"  r="4"/>
  </g>

  <!-- annotation for the dip -->
  <text x="343.6" y="200" text-anchor="middle" font-size="11" fill="#CC3311">creux estival</text>

  <!-- month labels -->
  <g font-size="10" fill="#6b7280" text-anchor="middle">
    <text x="70"    y="335">Jan</text>
    <text x="109.1" y="335">Fév</text>
    <text x="148.2" y="335">Mar</text>
    <text x="187.3" y="335">Avr</text>
    <text x="226.4" y="335">Mai</text>
    <text x="265.5" y="335">Juin</text>
    <text x="304.5" y="335">Juil</text>
    <text x="343.6" y="335">Août</text>
    <text x="382.7" y="335">Sep</text>
    <text x="421.8" y="335">Oct</text>
    <text x="460.9" y="335">Nov</text>
    <text x="500"   y="335">Déc</text>
  </g>
</svg>
