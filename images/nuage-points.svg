<svg viewBox="0 0 560 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <text x="280" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">Nuage de points — prix en fonction de la surface, par quartier</text>

  <!-- axes -->
  <line x1="60" y1="320" x2="520" y2="320" stroke="#374151" stroke-width="2"/>
  <line x1="60" y1="320" x2="60" y2="40" stroke="#374151" stroke-width="2"/>
  <text x="290" y="358" text-anchor="middle" font-size="13" fill="#374151">Surface (m²)</text>
  <text x="24" y="180" text-anchor="middle" font-size="13" fill="#374151" transform="rotate(-90 24 180)">Prix (MAD)</text>

  <!-- points quartier A -->
  <g fill="#0077BB" fill-opacity="0.85">
    <circle cx="90"  cy="290" r="6"/>
    <circle cx="120" cy="270" r="6"/>
    <circle cx="150" cy="260" r="6"/>
    <circle cx="180" cy="230" r="6"/>
    <circle cx="210" cy="220" r="6"/>
    <circle cx="230" cy="200" r="6"/>
    <circle cx="260" cy="190" r="6"/>
    <circle cx="290" cy="170" r="6"/>
    <circle cx="320" cy="150" r="6"/>
    <circle cx="350" cy="130" r="6"/>
  </g>

  <!-- points quartier B -->
  <g fill="#EE7733" fill-opacity="0.85">
    <circle cx="100" cy="250" r="6"/>
    <circle cx="140" cy="230" r="6"/>
    <circle cx="170" cy="210" r="6"/>
    <circle cx="200" cy="180" r="6"/>
    <circle cx="240" cy="160" r="6"/>
    <circle cx="270" cy="140" r="6"/>
    <circle cx="300" cy="120" r="6"/>
    <circle cx="330" cy="100" r="6"/>
    <circle cx="360" cy="90"  r="6"/>
    <circle cx="400" cy="70"  r="6"/>
  </g>

  <!-- legend -->
  <g font-size="13" fill="#1f2937">
    <circle cx="420" cy="55" r="6" fill="#0077BB"/>
    <text x="432" y="60">Quartier A</text>
    <circle cx="420" cy="78" r="6" fill="#EE7733"/>
    <text x="432" y="83">Quartier B</text>
  </g>
</svg>
