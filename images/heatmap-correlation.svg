<svg viewBox="0 0 460 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <text x="230" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">Heatmap — matrice de corrélation</text>

  <!-- column labels -->
  <g font-size="12" fill="#374151" text-anchor="middle">
    <text x="180" y="55">Surface</text>
    <text x="260" y="55">Prix</text>
    <text x="340" y="55">Pièces</text>
    <text x="420" y="55">Âge</text>
  </g>
  <!-- row labels -->
  <g font-size="12" fill="#374151" text-anchor="end">
    <text x="135" y="105">Surface</text>
    <text x="135" y="185">Prix</text>
    <text x="135" y="265">Pièces</text>
    <text x="135" y="345">Âge</text>
  </g>

  <!-- grid: 4 columns x 4 rows, cells 80x80, starting at x=140,y=65 -->
  <g stroke="#ffffff" stroke-width="2">
    <!-- row Surface -->
    <rect x="140" y="65"  width="80" height="80" fill="#b2182b"/>
    <rect x="220" y="65"  width="80" height="80" fill="#b2182b"/>
    <rect x="300" y="65"  width="80" height="80" fill="#ef8a62"/>
    <rect x="380" y="65"  width="80" height="80" fill="#d1e5f0"/>
    <!-- row Prix -->
    <rect x="140" y="145" width="80" height="80" fill="#b2182b"/>
    <rect x="220" y="145" width="80" height="80" fill="#b2182b"/>
    <rect x="300" y="145" width="80" height="80" fill="#ef8a62"/>
    <rect x="380" y="145" width="80" height="80" fill="#d1e5f0"/>
    <!-- row Pièces -->
    <rect x="140" y="225" width="80" height="80" fill="#ef8a62"/>
    <rect x="220" y="225" width="80" height="80" fill="#ef8a62"/>
    <rect x="300" y="225" width="80" height="80" fill="#b2182b"/>
    <rect x="380" y="225" width="80" height="80" fill="#f7f7f7"/>
    <!-- row Âge -->
    <rect x="140" y="305" width="80" height="80" fill="#d1e5f0"/>
    <rect x="220" y="305" width="80" height="80" fill="#d1e5f0"/>
    <rect x="300" y="305" width="80" height="80" fill="#f7f7f7"/>
    <rect x="380" y="305" width="80" height="80" fill="#b2182b"/>
  </g>

  <!-- values -->
  <g font-size="14" text-anchor="middle" font-weight="bold">
    <text x="180" y="110" fill="#ffffff">1.00</text>
    <text x="260" y="110" fill="#ffffff">0.82</text>
    <text x="340" y="110" fill="#1f2937">0.65</text>
    <text x="420" y="110" fill="#1f2937">-0.30</text>

    <text x="180" y="190" fill="#ffffff">0.82</text>
    <text x="260" y="190" fill="#ffffff">1.00</text>
    <text x="340" y="190" fill="#1f2937">0.55</text>
    <text x="420" y="190" fill="#1f2937">-0.20</text>

    <text x="180" y="270" fill="#1f2937">0.65</text>
    <text x="260" y="270" fill="#1f2937">0.55</text>
    <text x="340" y="270" fill="#ffffff">1.00</text>
    <text x="420" y="270" fill="#1f2937">-0.10</text>

    <text x="180" y="350" fill="#1f2937">-0.30</text>
    <text x="260" y="350" fill="#1f2937">-0.20</text>
    <text x="340" y="350" fill="#1f2937">-0.10</text>
    <text x="420" y="350" fill="#ffffff">1.00</text>
  </g>
</svg>
