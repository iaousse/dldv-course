<svg viewBox="0 0 560 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <text x="280" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">Diagramme en barres — chiffre d'affaires par région</text>

  <!-- axis -->
  <line x1="180" y1="45" x2="180" y2="300" stroke="#374151" stroke-width="2"/>
  <line x1="180" y1="300" x2="500" y2="300" stroke="#374151" stroke-width="2"/>
  <text x="340" y="325" text-anchor="middle" font-size="13" fill="#374151">Chiffre d'affaires (k MAD)</text>

  <!-- bars (horizontal, triées par ordre décroissant) -->
  <g>
    <rect x="180" y="55"  width="300" height="30" fill="#0077BB"/>
    <text x="170" y="75" text-anchor="end" font-size="13" fill="#1f2937">Casablanca</text>
    <text x="488" y="75" font-size="12" fill="#374151">1 200</text>

    <rect x="180" y="105" width="237.5" height="30" fill="#0077BB"/>
    <text x="170" y="125" text-anchor="end" font-size="13" fill="#1f2937">Rabat</text>
    <text x="425.5" y="125" font-size="12" fill="#374151">950</text>

    <rect x="180" y="155" width="200" height="30" fill="#0077BB"/>
    <text x="170" y="175" text-anchor="end" font-size="13" fill="#1f2937">Marrakech</text>
    <text x="388" y="175" font-size="12" fill="#374151">800</text>

    <rect x="180" y="205" width="150" height="30" fill="#0077BB"/>
    <text x="170" y="225" text-anchor="end" font-size="13" fill="#1f2937">Tanger</text>
    <text x="338" y="225" font-size="12" fill="#374151">600</text>

    <rect x="180" y="255" width="105" height="30" fill="#0077BB"/>
    <text x="170" y="275" text-anchor="end" font-size="13" fill="#1f2937">Agadir</text>
    <text x="293" y="275" font-size="12" fill="#374151">420</text>
  </g>
</svg>
