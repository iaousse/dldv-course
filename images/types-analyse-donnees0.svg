<svg viewBox="0 0 820 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrowhead-ta" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#4b5563"/>
    </marker>
    <linearGradient id="grad-desc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfdbfe"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="grad-diag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <linearGradient id="grad-pred" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
    <linearGradient id="grad-presc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
  </defs>

  <!-- Axes -->
  <line x1="70" y1="430" x2="780" y2="430" stroke="#374151" stroke-width="2" marker-end="url(#arrowhead-ta)"/>
  <line x1="70" y1="430" x2="70" y2="40" stroke="#374151" stroke-width="2" marker-end="url(#arrowhead-ta)"/>
  <text x="425" y="465" text-anchor="middle" font-size="16" fill="#374151">Complexité et valeur de la question posée</text>
  <text x="35" y="235" text-anchor="middle" font-size="16" fill="#374151" transform="rotate(-90 35 235)">Valeur pour la décision</text>

  <!-- Step 1 : Descriptive -->
  <rect x="120" y="350" width="140" height="80" rx="8" fill="url(#grad-desc)" stroke="#2563eb" stroke-width="1.5"/>
  <text x="190" y="380" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e3a8a">Descriptive</text>
  <text x="190" y="402" text-anchor="middle" font-size="13" fill="#1e3a8a">Que s'est-il</text>
  <text x="190" y="417" text-anchor="middle" font-size="13" fill="#1e3a8a">passé ?</text>

  <!-- Step 2 : Diagnostique -->
  <rect x="300" y="280" width="140" height="80" rx="8" fill="url(#grad-diag)" stroke="#059669" stroke-width="1.5"/>
  <text x="370" y="310" text-anchor="middle" font-size="17" font-weight="bold" fill="#065f46">Diagnostique</text>
  <text x="370" y="332" text-anchor="middle" font-size="13" fill="#065f46">Pourquoi cela</text>
  <text x="370" y="347" text-anchor="middle" font-size="13" fill="#065f46">s'est-il produit ?</text>

  <!-- Step 3 : Predictive -->
  <rect x="480" y="180" width="140" height="80" rx="8" fill="url(#grad-pred)" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="550" y="205" text-anchor="middle" font-size="17" font-weight="bold" fill="#78350f">Prédictive</text>
  <text x="550" y="227" text-anchor="middle" font-size="13" fill="#78350f">Que va-t-il</text>
  <text x="550" y="242" text-anchor="middle" font-size="13" fill="#78350f">probablement se passer ?</text>
  <text x="550" y="270" text-anchor="middle" font-size="11" font-style="italic" fill="#92400e">(module Machine Learning)</text>

  <!-- Step 4 : Prescriptive -->
  <rect x="640" y="80" width="140" height="80" rx="8" fill="url(#grad-presc)" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="710" y="105" text-anchor="middle" font-size="17" font-weight="bold" fill="#7f1d1d">Prescriptive</text>
  <text x="710" y="127" text-anchor="middle" font-size="13" fill="#7f1d1d">Que devrait-on</text>
  <text x="710" y="142" text-anchor="middle" font-size="13" fill="#7f1d1d">faire ?</text>
  <text x="710" y="170" text-anchor="middle" font-size="11" font-style="italic" fill="#991b1b">(module Machine Learning)</text>

  <!-- connecting arrows -->
  <line x1="260" y1="380" x2="300" y2="330" stroke="#4b5563" stroke-width="2" marker-end="url(#arrowhead-ta)"/>
  <line x1="440" y1="310" x2="480" y2="230" stroke="#4b5563" stroke-width="2" marker-end="url(#arrowhead-ta)"/>
  <line x1="620" y1="210" x2="640" y2="130" stroke="#4b5563" stroke-width="2" marker-end="url(#arrowhead-ta)"/>

  <!-- legend: scope of this course -->
  <rect x="120" y="20" width="18" height="18" fill="url(#grad-desc)" stroke="#2563eb"/>
  <text x="145" y="34" font-size="13" fill="#374151">Traité dans ce cours (chapitres 1 à 4)</text>
  <rect x="420" y="20" width="18" height="18" fill="url(#grad-pred)" stroke="#d97706" stroke-dasharray="4 3"/>
  <text x="445" y="34" font-size="13" fill="#374151">Hors périmètre de ce cours</text>
</svg>
