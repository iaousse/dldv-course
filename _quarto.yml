project:
  type: book
  output-dir: docs

profile:
  default: student
lang: fr
number-sections: false
language:
  title-block-author-single: "Auteur"
  title-block-author-plural: "Auteurs"
  author-title: "Auteur"
  authors-title: "Auteurs"
crossref:
  fig-prefix: Figure     # (Par défaut "Figure")
  tbl-prefix: Table    # (Par défaut "Table")
  sec-prefix: Section    # (Par défaut "Section")
  eq-prefix: Équation    # (Par défaut "Équation")
  chapters: false

book:
  title: "Analyse et visualisation de données"
  sidebar:
    logo: images/logo_estc.png
    tools:
      - icon: github
        href: https://github.com/iaousse/
        aria-label: GitHub
        target: _blank
      - icon: linkedin
        href: https://www.linkedin.com/in/mbarekiaousse
        aria-label: LinkedIn
        target: _blank
  author: "IAOUSSE M'barek"
  date: "2026"
  date-format: "YYYY"
  # Navigation et options web
  search: true
  downloads: [pdf, epub]
  
  # Structure du livre (votre table des matières)
  chapters:
    - index.qmd
    - preface.qmd
    - chapitres/00_introduction_analyse_donnees.qmd
    - chapitres/module_collecte_pretraitement_commun.qmd
    #- chapitres/01_preparation_donnees.qmd
    - chapitres/02_exploration_donnees.qmd
    - chapitres/03_visualisation_donnees.qmd
    - chapitres/04_entropot_donnees.qmd
    - chapitres/05_powerbi-taipy.qmd
    - chapitres/06_cas_pratique.qmd
    - tp/lab0_environement_python.qmd
    - tp/lab1_collect_donnees.qmd
    - tp/lab2_eda_pretraitement_donnees.qmd
    - tp/lab3_visualisation_donnees.qmd
    - tp/lab4_entropot_donnees_powerbi.qmd
    - tp/lab5_entropot_donnees_taipy.qmd
    - references.qmd

# Configuration pour le code Python
execute:
  freeze: auto   # Ne réexécute le code Python que si le fichier .qmd est modifié
  echo: true     # Affiche le code par défaut dans le livre

# Bibliographie
bibliography: references.bib
link-citations: true
citations-hover: true

# Styles d'exportation
format:
  html:
    theme:
      light: spacelab
      dark: darkly
    respect-user-color-scheme: false
    #title-block-banner: true    # Active le bloc d'en-tête (prend la couleur bleue du thème)
    title-block-banner: "#a6c5e7" #"#1a467e" # Optionnel : remplacez "true" par un code couleur précis pour correspondre au bleu de l'ESTC
    
    # Options pour une mise en page "pratique" :
    toc: true                   # Affiche la table des matières de la page
    toc-title: "Dans ce chapitre" 
    toc-location: right         # Place la table des matières à droite (très pratique pour lire)
    toc-depth: 3
    number-sections: false
    grid:
      body-width: 1100px    # Augmente considérablement l'espace pour le contenu central
      margin-width: 250px   # Maintient la marge de droite (Table des matières)
      sidebar-width: 250px  # Maintient la marge de gauche (Menu des chapitres)
 
    code-copy: true             # Ajoute un petit bouton pour copier le code Python
    code-fold: show             # Permet de masquer/afficher les longs blocs de code
    smooth-scroll: true         # Défilement fluide
    html-math-method: mathjax
    include-in-header:
      text: |
        <script>
        window.MathJax = {
          tex: {
            macros: {
              Z: "\\mathbb{Z}",
              N: "\\mathbb{N}",
              C: "\\mathbb{C}",
              Q: "\\mathbb{Q}",
              R: "\\mathbb{R}",
              B: "\\mathcal{B}",
              M: "\\mathcal{M}",
              S: "\\mathbb{S}",
              abs: ["\\left|#1\\right|", 1],
              norm: ["\\left\\Vert#1\\right\\Vert", 1],
              sign: "\\mathrm{sign}",
              vec: ["\\mathbf{#1}", 1]
            }
          }
        };
        </script>
  epub: default  
  pdf:
    documentclass: scrbook
    pdf-engine: xelatex   # Ou pdflatex
    fontsize: 11pt
    papersize: a4
    title-block: false
    toc: false
    number-sections: false
    colorlinks: true
    linkcolor: blue
    citeproc: true
    classoption:
      - open=any
    geometry:
      - top=25mm
      - bottom=25mm
      - left=20mm
      - right=20mm
    header-includes:
      - \usepackage{graphicx}
      - \usepackage{ragged2e}
      - \usepackage{xcolor}
      - \definecolor{analyse-theorem}{HTML}{164E82}
      - \definecolor{analyse-proof}{HTML}{94520B}
      - \definecolor{analyse-definition}{HTML}{17665F}
      - \definecolor{analyse-example}{HTML}{496A2A}
      - \colorlet{quarto-callout-important-color}{analyse-theorem}
      - \colorlet{quarto-callout-important-color-frame}{analyse-theorem}
      - \colorlet{quarto-callout-caution-color}{analyse-proof}
      - \colorlet{quarto-callout-caution-color-frame}{analyse-proof}
      - \colorlet{quarto-callout-note-color}{analyse-definition}
      - \colorlet{quarto-callout-note-color-frame}{analyse-definition}
      - \colorlet{quarto-callout-tip-color}{analyse-example}
      - \colorlet{quarto-callout-tip-color-frame}{analyse-example}
      - |
        \makeatletter
        \renewcommand{\maketitle}{}
        \AtBeginDocument{\frontmatter\pagenumbering{gobble}\pagestyle{empty}}
        \let\ps@plain\ps@empty
        \makeatother
      - \newcommand{\Z}{\mathbb{Z}}
      - \newcommand{\N}{\mathbb{N}}
      - \newcommand{\C}{\mathbb{C}}
      - \newcommand{\Q}{\mathbb{Q}}
      - \newcommand{\R}{\mathbb{R}}
      - \newcommand{\B}{\mathcal{B}}
      - \newcommand{\M}{\mathcal{M}}
      - \newcommand{\abs}[1]{\left|#1\right|}
      - \newcommand{\norm}[1]{\left\Vert#1\right\Vert}
