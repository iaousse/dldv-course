<svg viewBox="0 0 760 760" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrowhead-cv" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- center label -->
  <circle cx="380" cy="380" r="95" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="380" y="372" text-anchor="middle" font-size="16" font-weight="bold" fill="#374151">Cycle</text>
  <text x="380" y="393" text-anchor="middle" font-size="16" font-weight="bold" fill="#374151">itératif</text>

  <!-- 6 steps arranged in a circle, radius 260, angles starting at top going clockwise -->
  <!-- Step 1: Cadrage (top) -->
  <g>
    <rect x="300" y="40" width="160" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="380" y="72" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">1. Cadrage</text>
    <text x="380" y="92" text-anchor="middle" font-size="12" fill="#1e3a8a">Formuler la question</text>
    <text x="380" y="107" text-anchor="middle" font-size="12" fill="#1e3a8a">métier</text>
  </g>

  <!-- Step 2: Collecte (upper right) -->
  <g>
    <rect x="540" y="185" width="160" height="80" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
    <text x="620" y="217" text-anchor="middle" font-size="15" font-weight="bold" fill="#065f46">2. Collecte</text>
    <text x="620" y="237" text-anchor="middle" font-size="12" fill="#065f46">BDD, fichiers,</text>
    <text x="620" y="252" text-anchor="middle" font-size="12" fill="#065f46">API, web scraping</text>
  </g>

  <!-- Step 3: Nettoyage (lower right) -->
  <g>
    <rect x="540" y="470" width="160" height="80" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="620" y="502" text-anchor="middle" font-size="15" font-weight="bold" fill="#78350f">3. Nettoyage</text>
    <text x="620" y="522" text-anchor="middle" font-size="12" fill="#78350f">Valeurs manquantes,</text>
    <text x="620" y="537" text-anchor="middle" font-size="12" fill="#78350f">aberrantes, doublons</text>
  </g>

  <!-- Step 4: Transformation (bottom) -->
  <g>
    <rect x="300" y="610" width="160" height="80" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="380" y="642" text-anchor="middle" font-size="15" font-weight="bold" fill="#7f1d1d">4. Transformation</text>
    <text x="380" y="662" text-anchor="middle" font-size="12" fill="#7f1d1d">Encodage, normalisation,</text>
    <text x="380" y="677" text-anchor="middle" font-size="12" fill="#7f1d1d">discrétisation</text>
  </g>

  <!-- Step 5: Exploration (lower left) -->
  <g>
    <rect x="60" y="470" width="160" height="80" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="140" y="502" text-anchor="middle" font-size="15" font-weight="bold" fill="#4c1d95">5. Exploration</text>
    <text x="140" y="522" text-anchor="middle" font-size="12" fill="#4c1d95">Statistiques, EDA,</text>
    <text x="140" y="537" text-anchor="middle" font-size="12" fill="#4c1d95">corrélations</text>
  </g>

  <!-- Step 6: Visualisation (upper left) -->
  <g>
    <rect x="60" y="185" width="160" height="80" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
    <text x="140" y="217" text-anchor="middle" font-size="15" font-weight="bold" fill="#831843">6. Visualisation</text>
    <text x="140" y="237" text-anchor="middle" font-size="12" fill="#831843">Graphiques et</text>
    <text x="140" y="252" text-anchor="middle" font-size="12" fill="#831843">communication</text>
  </g>

  <!-- Arrows connecting steps clockwise, curved between box edges -->
  <path d="M 460,90 C 520,110 540,140 585,190" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#arrowhead-cv)"/>
  <path d="M 620,265 C 640,340 640,390 620,470" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#arrowhead-cv)"/>
  <path d="M 585,550 C 540,600 520,620 460,645" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#arrowhead-cv)"/>
  <path d="M 300,650 C 240,625 220,605 175,555" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#arrowhead-cv)"/>
  <path d="M 140,470 C 120,390 120,340 140,265" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#arrowhead-cv)"/>
  <path d="M 175,185 C 220,140 240,110 300,90" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#arrowhead-cv)"/>

  <!-- note about iteration -->
  <text x="380" y="740" text-anchor="middle" font-size="13" font-style="italic" fill="#6b7280">
    Une exploration ou une visualisation décevante ramène souvent vers les étapes 2, 3 ou 4.
  </text>
</svg>
