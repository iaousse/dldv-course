<svg viewBox="0 0 820 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrowhead-ta" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#4b5563"/>
    </marker>
    <linearGradient id="grad-desc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfdbfe"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="grad-diag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <linearGradient id="grad-pred" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
    <linearGradient id="grad-presc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
  </defs>

  <!-- Axes -->
  <line x1="70" y1="410" x2="780" y2="410" stroke="#374151" stroke-width="2" marker-end="url(#arrowhead-ta)"/>
  <line x1="70" y1="410" x2="70" y2="40" stroke="#374151" stroke-width="2" marker-end="url(#arrowhead-ta)"/>
  <text x="425" y="445" text-anchor="middle" font-size="16" fill="#374151">Complexité et valeur de la question posée</text>
  <text x="35" y="225" text-anchor="middle" font-size="16" fill="#374151" transform="rotate(-90 35 225)">Valeur pour la décision</text>

  <!-- Step 1 : Descriptive -->
  <rect x="120" y="330" width="150" height="90" rx="8" fill="url(#grad-desc)" stroke="#2563eb" stroke-width="1.5"/>
  <text x="195" y="360" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e3a8a">Descriptive</text>
  <text x="195" y="384" text-anchor="middle" font-size="13" fill="#1e3a8a">Que s'est-il</text>
  <text x="195" y="400" text-anchor="middle" font-size="13" fill="#1e3a8a">passé ?</text>

  <!-- Step 2 : Diagnostique -->
  <rect x="305" y="255" width="150" height="90" rx="8" fill="url(#grad-diag)" stroke="#059669" stroke-width="1.5"/>
  <text x="380" y="285" text-anchor="middle" font-size="17" font-weight="bold" fill="#065f46">Diagnostique</text>
  <text x="380" y="309" text-anchor="middle" font-size="13" fill="#065f46">Pourquoi cela</text>
  <text x="380" y="325" text-anchor="middle" font-size="13" fill="#065f46">s'est-il produit ?</text>

  <!-- Step 3 : Predictive -->
  <rect x="490" y="150" width="150" height="90" rx="8" fill="url(#grad-pred)" stroke="#d97706" stroke-width="1.5"/>
  <text x="565" y="180" text-anchor="middle" font-size="17" font-weight="bold" fill="#78350f">Prédictive</text>
  <text x="565" y="204" text-anchor="middle" font-size="13" fill="#78350f">Que va-t-il</text>
  <text x="565" y="220" text-anchor="middle" font-size="13" fill="#78350f">probablement se passer ?</text>

  <!-- Step 4 : Prescriptive -->
  <rect x="650" y="60" width="150" height="90" rx="8" fill="url(#grad-presc)" stroke="#dc2626" stroke-width="1.5"/>
  <text x="725" y="90" text-anchor="middle" font-size="17" font-weight="bold" fill="#7f1d1d">Prescriptive</text>
  <text x="725" y="114" text-anchor="middle" font-size="13" fill="#7f1d1d">Que devrait-on</text>
  <text x="725" y="130" text-anchor="middle" font-size="13" fill="#7f1d1d">faire ?</text>

  <!-- connecting arrows -->
  <line x1="270" y1="360" x2="305" y2="310" stroke="#4b5563" stroke-width="2" marker-end="url(#arrowhead-ta)"/>
  <line x1="455" y1="285" x2="490" y2="205" stroke="#4b5563" stroke-width="2" marker-end="url(#arrowhead-ta)"/>
  <line x1="640" y1="180" x2="650" y2="115" stroke="#4b5563" stroke-width="2" marker-end="url(#arrowhead-ta)"/>
</svg>
